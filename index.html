<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Resistance</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: white;
            color: black;
            font-family: sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #textInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            z-index: 1;
            font-size: 16px;
            line-height: 1.5;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="textInput" placeholder="ここにテキストを入力してください..."></textarea>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        let grid = [];
        const CELL_SIZE = 16;
        const COVERAGE_RATIO = 1/2;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initializeGrid();
        }

        function initializeGrid() {
            const cols = Math.ceil(canvas.width / CELL_SIZE);
            const rows = Math.ceil(canvas.height / CELL_SIZE);
            grid = Array(rows).fill().map(() => Array(cols).fill(false));
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cols = Math.ceil(canvas.width / CELL_SIZE);
            const rows = Math.ceil(canvas.height / CELL_SIZE);
            const totalCells = cols * rows;
            const cellsToFill = Math.floor(totalCells * COVERAGE_RATIO);

            // 前のフレームのセルをクリア
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (grid[i][j]) {
                        grid[i][j] = false;
                    }
                }
            }

            // 新しいセルをランダムに選択して描画
            for (let i = 0; i < cellsToFill; i++) {
                const row = Math.floor(Math.random() * rows);
                const col = Math.floor(Math.random() * cols);
                
                if (!grid[row][col]) {
                    grid[row][col] = true;
                    ctx.fillStyle = 'white';
                    ctx.fillRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }

            requestAnimationFrame(drawFrame);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawFrame();
    </script>
</body>
</html>
