<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Resistance</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: white;
            color: black;
            font-family: sans-serif;
            box-sizing: border-box;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: calc(100vh - 40px);
            overflow: hidden;
        }
        #textInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            z-index: 1;
            font-size: 16px;
            line-height: 1.5;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .share-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 3;
        }
        .share-button:hover {
            background-color: #0056b3;
        }
        .toggle-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 3;
        }
        .toggle-button:hover {
            background-color: #5a6268;
        }
        .toggle-button.active {
            background-color: #28a745;
        }
        .toggle-button.active:hover {
            background-color: #218838;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 80px;
            height: 34px;
            background-color: #6c757d;
            border-radius: 17px;
            cursor: pointer;
            z-index: 3;
            transition: background-color 0.3s;
            margin-left: 4px;
        }
        .toggle-switch.active {
            background-color: #28a745;
        }
        .toggle-switch::before {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            top: 4px;
            left: 4px;
            background-color: white;
            transition: transform 0.3s;
            z-index: 2;
        }
        .toggle-switch .toggle-switch-text {
            transform: translateX(16px);
        }
        .toggle-switch.active .toggle-switch-text {
            transform: translateX(-16px);
        }
        .toggle-switch.active::before {
            transform: translateX(46px);
        }
        .toggle-switch-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 11px;
            line-height: 34px;
            user-select: none;
            white-space: nowrap;
        }
        .toggle-label {
            position: relative;
            display: inline-block;
            color: #333;
            font-size: 12px;
            line-height: 34px;
            user-select: none;
            margin-right: 4px;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            z-index: 3;
        }
        .readonly {
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            pointer-events: none !important;
        }
        .readonly::selection {
            background: none !important;
        }
        .readonly::-moz-selection {
            background: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="textInput" placeholder="Enter text here..."></textarea>
        <canvas id="overlayCanvas"></canvas>
        <div class="controls">
            <span class="toggle-label">Protect</span>
            <div id="toggleButton" class="toggle-switch">
                <span class="toggle-switch-text">OFF</span>
            </div>
            <button id="shareButton" class="share-button">Share</button>
        </div>
    </div>

    <script>
        // 言語設定
        const translations = {
            'en': {
                placeholder: 'Enter text here...',
                shareButton: 'Share',
                shareSuccess: 'Share URL copied to clipboard!',
                shareError: 'Failed to copy share URL. Please copy manually:\n',
                emptyText: 'Please enter text to share.',
                protectOn: 'ON',
                protectOff: 'OFF',
                protectLabel: 'Protect'
            },
            'es': {
                placeholder: 'Ingrese texto aquí...',
                shareButton: 'Compartir',
                shareSuccess: '¡URL de compartir copiada al portapapeles!',
                shareError: 'Error al copiar la URL de compartir. Por favor, copie manualmente:\n',
                emptyText: 'Por favor, ingrese texto para compartir.',
                protectOn: 'ON',
                protectOff: 'OFF',
                protectLabel: 'Proteger'
            },
            'fr': {
                placeholder: 'Entrez votre texte ici...',
                shareButton: 'Partager',
                shareSuccess: 'URL de partage copiée dans le presse-papiers !',
                shareError: 'Échec de la copie de l\'URL de partage. Veuillez copier manuellement :\n',
                emptyText: 'Veuillez entrer du texte à partager.',
                protectOn: 'ON',
                protectOff: 'OFF',
                protectLabel: 'Protection'
            },
            'de': {
                placeholder: 'Text hier eingeben...',
                shareButton: 'Teilen',
                shareSuccess: 'Teilen-URL in die Zwischenablage kopiert!',
                shareError: 'Fehler beim Kopieren der Teilen-URL. Bitte manuell kopieren:\n',
                emptyText: 'Bitte geben Sie Text zum Teilen ein.',
                protectOn: 'EIN',
                protectOff: 'AUS',
                protectLabel: 'Schutz'
            },
            'zh': {
                placeholder: '在此输入文本...',
                shareButton: '分享',
                shareSuccess: '分享链接已复制到剪贴板！',
                shareError: '复制分享链接失败。请手动复制：\n',
                emptyText: '请输入要分享的文本。',
                protectOn: '开启',
                protectOff: '关闭',
                protectLabel: '保护'
            },
            'ja': {
                placeholder: 'ここにテキストを入力してください...',
                shareButton: '共有',
                shareSuccess: '共有URLをクリップボードにコピーしました！',
                shareError: '共有URLのコピーに失敗しました。手動でコピーしてください：\n',
                emptyText: '共有するテキストを入力してください。',
                protectOn: 'ON',
                protectOff: 'OFF',
                protectLabel: 'プロテクト'
            }
        };

        // ブラウザの言語設定を取得
        const getBrowserLanguage = () => {
            const lang = navigator.language || navigator.userLanguage;
            const shortLang = lang.split('-')[0];
            // サポートされている言語の場合のみその言語を使用し、それ以外は英語をデフォルトとする
            return Object.keys(translations).includes(shortLang) ? shortLang : 'en';
        };

        // 言語設定を適用
        const applyLanguage = () => {
            const lang = getBrowserLanguage();
            const t = translations[lang];
            
            // HTMLのlang属性を更新
            document.documentElement.lang = lang;
            
            document.getElementById('textInput').placeholder = t.placeholder;
            document.getElementById('shareButton').textContent = t.shareButton;
            document.querySelector('.toggle-switch-text').textContent = t.protectOff;
            document.querySelector('.toggle-label').textContent = t.protectLabel;
        };

        // 言語設定を適用
        applyLanguage();

        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const STRIPE_HEIGHT = 10; // 行の高さの1/3（16px * 1.5 / 3 = 8px）
        let isEvenFrame = true; // 偶数フレームかどうかを示すフラグ
        let isStripeVisible; // ストライプの表示状態

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (isStripeVisible) {
                const rows = Math.ceil((canvas.height - 60) / STRIPE_HEIGHT); // 下部60pxを除外
                
                // 縞模様を描画
                for (let row = 0; row < rows; row++) {
                    // 偶数フレームでは偶数行を、奇数フレームでは奇数行を描画
                    if ((isEvenFrame && row % 2 === 0) || (!isEvenFrame && row % 2 === 1)) {
                        const y = row * STRIPE_HEIGHT;
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, y, canvas.width, STRIPE_HEIGHT);
                    }
                }
            }

            // フレームの偶奇を切り替え
            isEvenFrame = !isEvenFrame;

            requestAnimationFrame(drawFrame);
        }

        // トグルボタンのイベントリスナー
        document.getElementById('toggleButton').addEventListener('click', function() {
            const lang = getBrowserLanguage();
            const t = translations[lang];
            
            isStripeVisible = !isStripeVisible;
            this.classList.toggle('active');
            this.querySelector('.toggle-switch-text').textContent = isStripeVisible ? t.protectOn : t.protectOff;
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawFrame();

        // AES暗号化のキー（実際の運用では環境変数などで管理すべき）
        const AES_KEY = 'your-secret-key-123';

        // URLパラメータから暗号化されたテキストを取得
        const urlParams = new URLSearchParams(window.location.search);
        const encryptedText = urlParams.get('text');

        // 共有モードかどうかを判定
        const isSharedMode = !!encryptedText;
        isStripeVisible = isSharedMode; // 共有モードの場合はON、それ以外はOFF

        if (isSharedMode) {
            try {
                // 暗号化されたテキストを復号化
                const decrypted = CryptoJS.AES.decrypt(encryptedText, AES_KEY).toString(CryptoJS.enc.Utf8);
                if (decrypted) {
                    const textInput = document.getElementById('textInput');
                    textInput.value = decrypted;
                    textInput.readOnly = true;
                    textInput.classList.add('readonly');
                    document.getElementById('shareButton').style.display = 'none';
                    document.querySelector('.controls').style.display = 'none'; // プロテクトスイッチを非表示

                    // コピー防止のためのイベントリスナーを追加
                    textInput.addEventListener('copy', (e) => e.preventDefault());
                    textInput.addEventListener('cut', (e) => e.preventDefault());
                    textInput.addEventListener('paste', (e) => e.preventDefault());
                    textInput.addEventListener('keydown', (e) => {
                        if (e.ctrlKey || e.metaKey) {
                            if (e.key === 'c' || e.key === 'v' || e.key === 'x' || e.key === 'a') {
                                e.preventDefault();
                            }
                        }
                    });
                    textInput.addEventListener('contextmenu', (e) => e.preventDefault());
                }
            } catch (error) {
                console.error('Decryption failed:', error);
            }
        }

        // 共有ボタンのクリックイベント
        document.getElementById('shareButton').addEventListener('click', () => {
            const text = document.getElementById('textInput').value;
            const lang = getBrowserLanguage();
            const t = translations[lang];

            if (!text) {
                alert(t.emptyText);
                return;
            }

            // テキストを暗号化
            const encrypted = CryptoJS.AES.encrypt(text, AES_KEY).toString();
            
            // 現在のURLに暗号化されたテキストを追加
            const shareUrl = `${window.location.origin}${window.location.pathname}?text=${encodeURIComponent(encrypted)}`;
            
            // クリップボードにコピー
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert(t.shareSuccess);
            }).catch(err => {
                console.error('Failed to copy to clipboard:', err);
                alert(t.shareError + shareUrl);
            });
        });
    </script>
</body>
</html>
