<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Resistance</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: white;
            color: black;
            font-family: sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #textInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            z-index: 1;
            font-size: 16px;
            line-height: 1.5;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="textInput" placeholder="ここにテキストを入力してください..."></textarea>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const STRIPE_HEIGHT = 8; // 縞模様の高さ
        let isEvenFrame = true; // 偶数フレームかどうかを示すフラグ

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const rows = Math.ceil(canvas.height / STRIPE_HEIGHT);
            
            // 縞模様を描画
            for (let row = 0; row < rows; row++) {
                // 偶数フレームでは偶数行を、奇数フレームでは奇数行を描画
                if ((isEvenFrame && row % 2 === 0) || (!isEvenFrame && row % 2 === 1)) {
                    const y = row * STRIPE_HEIGHT;
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, y, canvas.width, STRIPE_HEIGHT);
                }
            }

            // フレームの偶奇を切り替え
            isEvenFrame = !isEvenFrame;

            requestAnimationFrame(drawFrame);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawFrame();
    </script>
</body>
</html>
